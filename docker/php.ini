; Development-friendly PHP settings for the Laravel app container
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 68M
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
